<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Runner - Astana</title>
    <link rel="stylesheet" href="../assets/css/tailwind.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .test-pass { color: #10b981; }
        .test-fail { color: #ef4444; }
        .test-running { color: #f59e0b; }
        .tab-active { background: #059669; color: white; }
        .tab-inactive { background: #e5e7eb; color: #374151; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">🧪 Astana Test Runner</h1>
                    <p class="text-gray-600">Select a module and click Run</p>
                </div>
                <div class="flex gap-2">
                    <button id="btnRunAllTests" class="bg-emerald-600 text-white px-6 py-2 rounded-lg hover:bg-emerald-700 transition-colors">Run All Tests</button>
                </div>
            </div>
            <div class="flex gap-2 mt-4 flex-wrap" id="tabContainer">
                <button data-module="AuthTests" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium tab-active">Auth</button>
                <button data-module="BlokTests" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium tab-inactive">Blok</button>
                <button data-module="DataMakamTests" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium tab-inactive">Data Makam</button>
                <button data-module="PembayaranTests" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium tab-inactive">Pembayaran</button>
                <button data-module="LaporanTests" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium tab-inactive">Laporan</button>
                <button data-module="PengaturanTests" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium tab-inactive">Pengaturan</button>
                <button data-module="PenggunaTests" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium tab-inactive">Pengguna</button>
                <button data-module="AuditLogTests" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium tab-inactive">Audit Log</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-lg shadow">
                <div class="p-4 border-b border-gray-200">
                    <h2 class="font-semibold text-gray-800">Test Results</h2>
                </div>
                <div id="testResults" class="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                    <div class="p-8 text-center text-gray-400">
                        <p>Select a module and click "Run"</p>
                        <p class="text-sm mt-2">Or click "Run All Tests" to run everything</p>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="font-semibold text-gray-800 mb-4">Summary</h2>
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div class="bg-emerald-50 rounded-lg p-4">
                            <p class="text-3xl font-bold text-emerald-600" id="passedCount">0</p>
                            <p class="text-sm text-emerald-700">Passed</p>
                        </div>
                        <div class="bg-red-50 rounded-lg p-4">
                            <p class="text-3xl font-bold text-red-600" id="failedCount">0</p>
                            <p class="text-sm text-red-700">Failed</p>
                        </div>
                        <div class="bg-blue-50 rounded-lg p-4">
                            <p class="text-3xl font-bold text-blue-600" id="totalCount">0</p>
                            <p class="text-sm text-blue-700">Total</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow">
                    <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="font-semibold text-gray-800">Console Output</h2>
                        <button id="btnClearConsole" class="text-sm text-gray-500 hover:text-gray-700">Clear</button>
                    </div>
                    <div id="consoleOutput" class="p-4 h-64 overflow-y-auto font-mono text-sm bg-gray-900 text-gray-100 rounded-b-lg">
                        <div class="text-gray-500">> Test console ready...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="../login.html" class="text-emerald-600 hover:underline">← Back to Login</a>
        </div>
    </div>

    <script src="../main.js"></script>
    <script src="mock-tauri.js"></script>
    <script src="auth-ui-tests.js"></script>
    <script src="blok-tests.js"></script>
    <script src="data-makam-tests.js"></script>
    <script src="pembayaran-tests.js"></script>
    <script src="laporan-tests.js"></script>
    <script src="pengaturan-tests.js"></script>
    <script src="pengguna-tests.js"></script>
    <script src="audit-log-tests.js"></script>
    <script>
        const originalConsole = { log: console.log, error: console.error, warn: console.warn };

        function appendToConsole(type, ...args) {
            const consoleOutput = document.getElementById('consoleOutput');
            const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)).join(' ');
            const line = document.createElement('div');
            line.className = 'mb-1';
            if (type === 'error') line.className += ' text-red-400';
            else if (type === 'warn') line.className += ' text-yellow-400';
            else line.className += ' text-gray-300';
            line.textContent = `> ${message}`;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            originalConsole[type](...args);
        }

        console.log = (...args) => appendToConsole('log', ...args);
        console.error = (...args) => appendToConsole('error', ...args);
        console.warn = (...args) => appendToConsole('warn', ...args);

        let allTestSuites = {};

        function registerTestSuites() {
            if (window.AuthTests) allTestSuites['AuthTests'] = window.AuthTests;
            if (window.BlokTests) allTestSuites['BlokTests'] = window.BlokTests;
            if (window.DataMakamTests) allTestSuites['DataMakamTests'] = window.DataMakamTests;
            if (window.PembayaranTests) allTestSuites['PembayaranTests'] = window.PembayaranTests;
            if (window.LaporanTests) allTestSuites['LaporanTests'] = window.LaporanTests;
            if (window.PengaturanTests) allTestSuites['PengaturanTests'] = window.PengaturanTests;
            if (window.PenggunaTests) allTestSuites['PenggunaTests'] = window.PenggunaTests;
            if (window.AuditLogTests) allTestSuites['AuditLogTests'] = window.AuditLogTests;
        }

        async function runSuite(suiteName) {
            const suite = allTestSuites[suiteName];
            if (!suite) { console.log(`Suite ${suiteName} not found`); return; }
            await suite.run();
        }

        async function runAllSuites() {
            const btn = document.getElementById('btnRunAllTests');
            btn.disabled = true;
            btn.textContent = 'Running All...';
            btn.classList.add('opacity-50');

            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '';
            document.getElementById('passedCount').textContent = '0';
            document.getElementById('failedCount').textContent = '0';
            document.getElementById('totalCount').textContent = '0';

            console.log('\n🧪 Running ALL Test Suites...\n');
            let totalPassed = 0;
            let totalFailed = 0;

            for (const [name, suite] of Object.entries(allTestSuites)) {
                if (suite.tests.length === 0) continue;
                console.log(`\n━━━ Running ${name} (${suite.tests.length} tests) ━━━`);
                await suite.run();
                totalPassed += suite.passed;
                totalFailed += suite.failed;
            }

            document.getElementById('passedCount').textContent = totalPassed;
            document.getElementById('failedCount').textContent = totalFailed;
            document.getElementById('totalCount').textContent = totalPassed + totalFailed;

            console.log(`\n📊 All Tests: ${totalPassed} passed, ${totalFailed} failed`);
            btn.disabled = false;
            btn.textContent = 'Run All Tests';
            btn.classList.remove('opacity-50');
        }

        function clearConsole() {
            document.getElementById('consoleOutput').innerHTML = '<div class="text-gray-500">> Console cleared...</div>';
        }

        function setupTabNavigation() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.className = b.className.replace('tab-active', 'tab-inactive');
                    });
                    btn.className = btn.className.replace('tab-inactive', 'tab-active');
                    const module = btn.dataset.module;
                    await runSuite(module);
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            registerTestSuites();
            setupTabNavigation();
            document.getElementById('btnRunAllTests').addEventListener('click', runAllSuites);
            document.getElementById('btnClearConsole').addEventListener('click', clearConsole);
        });

        if (window.location.search.includes('autorun')) {
            window.addEventListener('load', () => setTimeout(runAllSuites, 500));
        }
    </script>
</body>
</html>
