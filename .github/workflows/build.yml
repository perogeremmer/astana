name: Build & Deploy Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4.2.2
    
    - name: Setup Node.js
      uses: actions/setup-node@v4.3.0
      with:
        node-version: 'lts/*'
    
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: x86_64-pc-windows-msvc
    
    - name: Install WiX Toolset for MSI
      run: |
        dotnet tool install --global wix --version 4.0.5
        wix extension add --global WixToolset.UI.wixext
    
    - name: Install Tauri CLI
      run: cargo install tauri-cli
    
    - name: Download and Install Tailwind CSS
      run: |
        Invoke-WebRequest -Uri "https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.1/tailwindcss-windows-x64.exe" -OutFile "$env:TEMP\tailwindcss.exe"
        
    - name: Build Tailwind CSS
      run: |
        & "$env:TEMP\tailwindcss.exe" -i src/input.css -o src/assets/css/tailwind.min.css --minify
        
    - name: Install dependencies
      run: |
        cd src-tauri
        cargo fetch
    
    - name: Check tauri config
      run: |
        cat src-tauri/tauri.conf.json | grep -A5 '"bundle"'
    
    - name: Build Windows Installer
      run: |
        cd src-tauri
        cargo tauri build --target x86_64-pc-windows-msvc --verbose
      env:
        TAURI_SIGNING_PRIVATE_KEY: ""
        CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    
    - name: List bundle files
      run: |
        Get-ChildItem -Path src-tauri/target -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
        Get-ChildItem -Path src-tauri/target -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like "*bundle*" }
    
    - name: Upload Windows Installer Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: astana-windows-installer
        path: |
          src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
          src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
        if-no-files-found: warn

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2.2.1
      with:
        files: |
          src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
          src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4.2.2
    
    - name: Setup Node.js
      uses: actions/setup-node@v4.3.0
      with:
        node-version: 'lts/*'
    
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
    
    - name: Install Tauri CLI
      run: cargo install tauri-cli --force

    - name: Download and Install Tailwind CSS
      run: |
        curl -L -o /tmp/tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.1/tailwindcss-linux-x64"
        chmod +x /tmp/tailwindcss

    - name: Build Tailwind CSS
      run: |
        /tmp/tailwindcss -i src/input.css -o src/assets/css/tailwind.min.css --minify

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

    - name: Build Linux App
      run: |
        cd src-tauri
        cargo tauri build
    
    - name: List bundle files
      run: |
        ls -la src-tauri/target/release/bundle/ 2>/dev/null || echo "Bundle directory not found"
    
    - name: Upload Linux App Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: astana-linux-app
        path: |
          src-tauri/target/release/bundle/**/*.AppImage
          src-tauri/target/release/bundle/**/*.deb
        if-no-files-found: warn

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2.2.1
      with:
        files: |
          src-tauri/target/release/bundle/**/*.AppImage
          src-tauri/target/release/bundle/**/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
