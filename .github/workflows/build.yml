name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: x86_64-pc-windows-msvc
    
    - name: Install WiX Toolset for MSI
      run: |
        dotnet tool install --global wix --version 4.0.5
        wix extension add --global WixToolset.UI.wixext
    
    - name: Install Tauri CLI
      run: cargo install tauri-cli
    
    - name: Install dependencies
      run: |
        cd src-tauri
        cargo fetch
    
    - name: Check tauri config
      run: |
        cat src-tauri/tauri.conf.json | grep -A5 '"bundle"'
    
    - name: Build Windows Installer
      run: |
        cd src-tauri
        cargo tauri build --target x86_64-pc-windows-msvc --verbose
      env:
        TAURI_SIGNING_PRIVATE_KEY: ""
    
    - name: List bundle files
      run: |
        Get-ChildItem -Path src-tauri/target -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
        Get-ChildItem -Path src-tauri/target -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like "*bundle*" }
    
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: astana-windows-installer
        path: |
          src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
          src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
          src-tauri/target/release/bundle/**/*.msi
          src-tauri/target/release/bundle/**/*.exe
        if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
    
    - name: Install Tauri CLI
      run: cargo install tauri-cli
    
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    
    - name: Build Linux App
      run: |
        cd src-tauri
        cargo tauri build
    
    - name: List bundle files
      run: |
        ls -la src-tauri/target/release/bundle/ 2>/dev/null || echo "Bundle directory not found"
    
    - name: Upload Linux App
      uses: actions/upload-artifact@v4
      with:
        name: astana-linux-app
        path: |
          src-tauri/target/release/bundle/**/*.AppImage
          src-tauri/target/release/bundle/**/*.deb
        if-no-files-found: warn